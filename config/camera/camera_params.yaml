# Camera Intrinsics and Extrinsics Configuration (Reference: RealSense / Stereo outdoor mount)
camera:
  width: 640
  height: 480
  fx: 385.0
  fy: 385.0
  cx: 320.0
  cy: 240.0
  distortion:
    k1: 0.0
    k2: 0.0
    p1: 0.0
    p2: 0.0
  stereo:
    baseline_m: 0.05
    depth_min_m: 0.25
    depth_max_m: 15.0
  extrinsics:
    mount_height_m: 0.45  # Height above ground in base_link
    pitch_rad: 0.209      # ~12 degrees downward pitch
    roll_rad: 0.0
    yaw_rad: 0.0
